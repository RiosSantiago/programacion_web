<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Empaque de frutas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E4D8"/>
      <stop offset="1" stop-color="#C4BC9F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="200" fill="#ffffff" opacity="0.35"/>
  <!-- caja -->
  <g transform="translate(400,330)">
    <rect x="-190" y="-120" width="380" height="240" rx="8" fill="#D8A85E" stroke="#7A4E1B" stroke-width="7"/>
    <path d="M-190 -120 l44 46 a10 10 0 0 0 7 3 l278 0 a10 10 0 0 0 7 -3 l44 -46 z" fill="#F0CC90"/>
    <rect x="-130" y="-60" width="260" height="130" rx="6" fill="#F6E7C1" stroke="#7A4E1B" stroke-width="5"/>
    <text x="0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#7A4E1B">FRUTAS</text>
    <text x="0" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7A4E1B">500 kg</text>
  </g>
  <!-- frutas a la vista -->
  <circle cx="330" cy="230" r="20" fill="#E2574C"/>
  <circle cx="390" cy="214" r="22" fill="#3E9B4F"/>
  <circle cx="450" cy="228" r="20" fill="#F4A93C"/>
  <text x="50" y="70" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#5C431B">Empaque</text>
</svg>