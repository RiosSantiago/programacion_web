    <ellipse cx="0" cy="-60" rx="150" ry="34" fill="#E5A653" stroke="#7A4E1B" stroke-width="6"/>
    <circle cx="-70" cy="-78" r="20" fill="#E2574C"/>
    <circle cx="0" cy="-92" r="22" fill="#3E9B4F"/>
    <circle cx="70" cy="-74" r="20" fill="#F4A93C"/>
    <circle cx="-34" cy="-96" r="16" fill="#F4A93C"/>
