  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="200" fill="#ffffff" opacity="0.35"/>
  <!-- rama del árbol -->
  <path d="M700 60 q-260 40 -360 200" stroke="#6B4A24" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="380" cy="190" r="34" fill="#E2574C"/>
  <circle cx="430" cy="170" r="34" fill="#3E9B4F"/>
  <circle cx="410" cy="230" r="34" fill="#F4A93C"/>
  <circle cx="348" cy="236" r="30" fill="#E2574C"/>
