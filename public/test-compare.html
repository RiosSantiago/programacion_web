<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Compare Cow Head</title>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 40px;
      color: #333;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .box {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.06);
      width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box img, .box object, .box svg {
      max-width: 340px;
      height: 340px;
      display: block;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #2D6A4F;
    }
    .label {
      font-size: 14px;
      color: #666;
      margin-top: 15px;
    }
    /* inline SVG container */
    .svg-wrap {
      width: 340px;
      height: 340px;
      border: 1px solid #eee;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Cow Illustration Animation Verification</h1>
  <p>Left = static reference. Right = new animated SVG (check shape match + animations).</p>
  
  <div class="container">
    <div class="box">
      <h3>1. Reference Illustration</h3>
      <img src="/images/ref-cow.png" alt="Original Reference">
      <div class="label">Static PNG (587×503)</div>
    </div>
    
    <div class="box">
      <h3>2. Animated SVG</h3>
      <div class="svg-wrap">
        <object type="image/svg+xml" data="/cow-head-animated.svg?v=3" width="340" height="340" style="border-radius:8px;"></object>
      </div>
      <div class="label">Animated SVG — transparent bg</div>
    </div>
  </div>

  <div style="margin-top:40px;">
    <h2>SVG Inline Preview (checkered = transparent)</h2>
    <div style="background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 20px 20px; display:inline-block; padding:20px; border-radius:12px;">
      <img src="/cow-head-animated.svg?v=3" width="300" height="300" alt="Animated SVG">
    </div>
  </div>
</body>
</html>
